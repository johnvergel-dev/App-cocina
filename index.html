<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <title>Mi Cocina</title>
    <script>
      // Capacitor bridge guard: ensure window.Capacitor.triggerEvent always exists.
      // The native bridge injects its own implementation right after <head>, but on some
      // Android WebView versions there is a small race window where native events
      // (pause/resume) fire via evaluateJavascript before that script has executed.
      // This stub is overwritten by the real bridge immediately after.
      (function () {
        if (!window.Capacitor) { window.Capacitor = {}; }
        if (!window.Capacitor.triggerEvent) {
          window.Capacitor.triggerEvent = function (n, t, d) {
            try {
              var ev = document.createEvent('Events');
              ev.initEvent(n, false, false);
              if (d) { for (var k in d) { if (Object.prototype.hasOwnProperty.call(d,k)) ev[k]=d[k]; } }
              if (t === 'document') { return document.dispatchEvent(ev); }
              if (t === 'window')   { return window.dispatchEvent(ev); }
            } catch (e) {}
            return false;
          };
        }
      })();
      // Apply the saved/system theme before first paint to avoid a flash.
      (function () {
        try {
          var s = localStorage.getItem('theme');
          var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
